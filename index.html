<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ping Pong</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #222; }
    </style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const paddleWidth = 10, paddleHeight = 60;
const ballSize = 10;
let leftY = canvas.height / 2 - paddleHeight / 2;
let rightY = leftY;
let ballX = canvas.width / 2, ballY = canvas.height / 2;
let ballVX = 4, ballVY = 2;
let leftUp = false, leftDown = false, rightUp = false, rightDown = false;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // draw paddles
    ctx.fillStyle = '#fff';
    ctx.fillRect(10, leftY, paddleWidth, paddleHeight);
    ctx.fillRect(canvas.width - 20, rightY, paddleWidth, paddleHeight);
    // draw ball
    ctx.fillRect(ballX - ballSize / 2, ballY - ballSize / 2, ballSize, ballSize);
}

function update() {
    if (leftUp) leftY -= 5;
    if (leftDown) leftY += 5;
    if (rightUp) rightY -= 5;
    if (rightDown) rightY += 5;
    leftY = Math.max(0, Math.min(canvas.height - paddleHeight, leftY));
    rightY = Math.max(0, Math.min(canvas.height - paddleHeight, rightY));

    ballX += ballVX;
    ballY += ballVY;
    if (ballY <= ballSize/2 || ballY >= canvas.height - ballSize/2) ballVY = -ballVY;
    if (ballX <= 20 && ballY >= leftY && ballY <= leftY + paddleHeight) ballVX = -ballVX;
    if (ballX >= canvas.width - 20 && ballY >= rightY && ballY <= rightY + paddleHeight) ballVX = -ballVX;
    if (ballX < 0 || ballX > canvas.width) { ballX = canvas.width/2; ballY = canvas.height/2; }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
    if (e.key === 'w') leftUp = true;
    if (e.key === 's') leftDown = true;
    if (e.key === 'ArrowUp') rightUp = true;
    if (e.key === 'ArrowDown') rightDown = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'w') leftUp = false;
    if (e.key === 's') leftDown = false;
    if (e.key === 'ArrowUp') rightUp = false;
    if (e.key === 'ArrowDown') rightDown = false;
});

loop();
</script>
</body>
</html>
